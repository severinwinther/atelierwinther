name: Generer prosjekter.json

on:
  push:
    paths:
      - 'prosjekter/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generer prosjekter.json
        run: python3 scripts/generate_prosjekter.py

      - name: Commit og push hvis endret
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prosjekter.json
          git diff --cached --quiet && echo "Ingen endringer" || \
            git commit -m "Auto: oppdater prosjekter.json [skip ci]" && git push
