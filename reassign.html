<meta charset="UTF-8">

<title>Cover Image Reassigner</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #111; color: #eee; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  #top { display: flex; flex: 1; overflow: hidden; min-height: 0; }
  #projects-panel { width: 340px; flex-shrink: 0; border-right: 1px solid #333; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 4px; }
  .proj-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 4px; cursor: pointer; border: 2px solid transparent; background: #1a1a1a; transition: background 0.1s; }
  .proj-item:hover { background: #252525; }
  .proj-item.selected { border-color: #f0c040; background: #2a2500; }
  .proj-item.confirmed { border-color: #40c060; }
  .proj-thumb { width: 60px; height: 40px; object-fit: cover; border-radius: 2px; background: #333; flex-shrink: 0; border: 1px solid #444; }
  .proj-info { flex: 1; min-width: 0; }
  .proj-title { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .proj-cat { font-size: 10px; color: #888; text-transform: uppercase; }
  .proj-status { font-size: 10px; margin-top: 2px; }
  .proj-item.confirmed .proj-status { color: #40c060; }
  .proj-item:not(.confirmed) .proj-status { color: #888; }
  #pool-panel { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 8px; }
  #pool-header { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
  #search { flex: 1; padding: 6px 10px; background: #222; border: 1px solid #444; color: #eee; border-radius: 4px; font-size: 13px; }
  #pool-count { font-size: 12px; color: #888; white-space: nowrap; }
  #pool-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 4px; overflow-y: auto; flex: 1; }
  .pool-img { aspect-ratio: 4/3; object-fit: cover; cursor: pointer; border-radius: 2px; border: 2px solid transparent; background: #222; transition: border-color 0.1s; width: 100%; display: block; }
  .pool-img:hover { border-color: #f0c040; }
  .pool-img.selected-pool { border-color: #f0c040; box-shadow: 0 0 0 2px #f0c040; }
  .pool-img-wrap { position: relative; }
  .pool-img-name { position: absolute; bottom: 0; left: 0; right: 0; font-size: 9px; color: #ddd; background: rgba(0,0,0,0.7); padding: 2px 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: none; }
  .pool-img-wrap:hover .pool-img-name { display: block; }
  #bottom { border-top: 1px solid #333; padding: 8px 12px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; background: #181818; }
  #progress { font-size: 13px; color: #aaa; flex: 1; }
  button { padding: 7px 16px; border-radius: 4px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; }
  #btn-confirm { background: #f0c040; color: #111; }
  #btn-confirm:disabled { background: #555; color: #999; cursor: default; }
  #btn-reset { background: #444; color: #eee; }
  #btn-generate { background: #40c060; color: #111; }
  #current-label { font-size: 12px; color: #aaa; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
<div id="top">
  <div id="projects-panel"></div>
  <div id="pool-panel">
    <div id="pool-header">
      <input id="search" type="text" placeholder="Filter images by name…" oninput="filterPool()">
      <span id="pool-count"></span>
    </div>
    <div id="pool-grid"></div>
  </div>
</div>
<div id="bottom">
  <span id="progress">Select a project on the left, then click an image on the right.</span>
  <span id="current-label"></span>
  <button id="btn-reset" onclick="resetCurrent()">Reset</button>
  <button id="btn-confirm" onclick="confirmCurrent()" disabled>Confirm ✓</button>
  <button id="btn-generate" onclick="generateScript()">Generate fix-covers.py ↓</button>
</div>

let selectedProject = null;
let selectedPoolImg = null;
let assignments = PROJECTS.map(p => p.cover.replace('img/', ''));
let confirmed = new Array(PROJECTS.length).fill(false);

const projPanel = document.getElementById('projects-panel');
PROJECTS.forEach((p, i) => {
  const div = document.createElement('div');
  div.className = 'proj-item';
  div.id = 'proj-' + i;
  div.onclick = () => selectProject(i);
  div.innerHTML = '<img class="proj-thumb" id="thumb-' + i + '" src="img/' + assignments[i] + '" onerror="this.style.opacity=\'0.3\'">'
    + '<div class="proj-info">'
    + '<div class="proj-title">' + p.title + '</div>'
    + '<div class="proj-cat">' + p.cat + '</div>'
    + '<div class="proj-status" id="status-' + i + '">not confirmed</div>'
    + '</div>';
  projPanel.appendChild(div);
});

let filteredImages = [...ALL_IMAGES];
const poolGrid = document.getElementById('pool-grid');

function renderPool() {
  poolGrid.innerHTML = '';
  filteredImages.forEach(fname => {
    const wrap = document.createElement('div');
    wrap.className = 'pool-img-wrap';
    const img = document.createElement('img');
    img.className = 'pool-img';
    img.src = 'img/' + fname;
    img.title = fname;
    img.dataset.fname = fname;
    img.loading = 'lazy';
    img.onerror = function() { this.style.opacity = '0.15'; };
    img.onclick = () => selectPoolImg(fname);
    if (selectedPoolImg === fname) img.classList.add('selected-pool');
    const label = document.createElement('div');
    label.className = 'pool-img-name';
    label.textContent = fname;
    wrap.appendChild(img);
    wrap.appendChild(label);
    poolGrid.appendChild(wrap);
  });
  document.getElementById('pool-count').textContent = filteredImages.length + ' / ' + ALL_IMAGES.length;
}

function filterPool() {
  const q = document.getElementById('search').value.toLowerCase();
  filteredImages = q ? ALL_IMAGES.filter(f => f.toLowerCase().includes(q)) : [...ALL_IMAGES];
  renderPool();
}

function selectProject(i) {
  selectedProject = i;
  selectedPoolImg = null;
  document.querySelectorAll('.proj-item').forEach(el => el.classList.remove('selected'));
  document.getElementById('proj-' + i).classList.add('selected');
  const cur = assignments[i];
  document.getElementById('progress').textContent = (i+1) + '/24 — "' + PROJECTS[i].title + '" — current: ' + cur;
  document.getElementById('current-label').textContent = '';
  document.getElementById('btn-confirm').disabled = true;
  document.querySelectorAll('.pool-img').forEach(el => {
    el.classList.toggle('selected-pool', el.dataset.fname === cur);
  });
  const curEl = poolGrid.querySelector('[data-fname="' + CSS.escape(cur) + '"]');
  if (curEl) curEl.scrollIntoView({ block: 'nearest' });
}

function selectPoolImg(fname) {
  selectedPoolImg = fname;
  document.querySelectorAll('.pool-img').forEach(el => {
    el.classList.toggle('selected-pool', el.dataset.fname === fname);
  });
  if (selectedProject !== null) {
    document.getElementById('current-label').textContent = '→ ' + fname;
    document.getElementById('btn-confirm').disabled = false;
    document.getElementById('thumb-' + selectedProject).src = 'img/' + fname;
  }
}

function confirmCurrent() {
  if (selectedProject === null || !selectedPoolImg) return;
  assignments[selectedProject] = selectedPoolImg;
  confirmed[selectedProject] = true;
  document.getElementById('thumb-' + selectedProject).src = 'img/' + selectedPoolImg;
  document.getElementById('proj-' + selectedProject).classList.add('confirmed');
  document.getElementById('status-' + selectedProject).textContent = '✓ ' + selectedPoolImg;
  const n = confirmed.filter(Boolean).length;
  document.getElementById('progress').textContent = n + '/24 confirmed' + (n === 24 ? ' — All done! Click Generate.' : '');
  const next = confirmed.findIndex((c, i) => !c && i > selectedProject);
  if (next !== -1) selectProject(next);
  else { const first = confirmed.findIndex(c => !c); if (first !== -1) selectProject(first); }
}

function resetCurrent() {
  if (selectedProject === null) return;
  assignments[selectedProject] = PROJECTS[selectedProject].cover.replace('img/', '');
  confirmed[selectedProject] = false;
  document.getElementById('thumb-' + selectedProject).src = 'img/' + assignments[selectedProject];
  document.getElementById('proj-' + selectedProject).classList.remove('confirmed');
  document.getElementById('status-' + selectedProject).textContent = 'not confirmed';
  selectProject(selectedProject);
}

function generateScript() {
  const lines = ['import re', 'with open("index.html", "r", encoding="utf-8") as f:', '    html = f.read()', '', 'replacements = ['];
  PROJECTS.forEach((p, i) => {
    const o = p.cover, n = 'img/' + assignments[i];
    if (o !== n) lines.push('    (' + JSON.stringify(o) + ', ' + JSON.stringify(n) + '),  # ' + p.title);
  });
  lines.push(']', '', 'for old, new in replacements:', '    html = html.replace(f\'data-cover="{old}"\', f\'data-cover="{new}"\', 1)', '', 'with open("index.html", "w", encoding="utf-8") as f:', '    f.write(html)', '', 'print("Done.")');
  const blob = new Blob([lines.join('\n')], {type:'text/plain'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'fix-covers.py'; a.click();
}

renderPool();
selectProject(0);
</script>
